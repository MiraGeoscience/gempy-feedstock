schema_version: 1

context:
  name: gempy
  version: "2025.2.1a2.dev16+ga7a5173c6"
  python_min: "3.12"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  #url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/gempy-${{ version }}.tar.gz
  url: https://github.com/gempy-project/gempy/archive/a7a5173c6b6ce75f3af8b7b5acf02bf20c07d385.tar.gz
  sha256: 68F3017C35C4504ADBA54227A390DA4189C149148382F8C5D82D496106707AA8

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - setuptools-scm
  run:
    - python >=${{ python_min }}
    - gempy-engine >=2025.3.0dev0,<2025.4.0
    - typing_extensions

tests:
  - python:
      python_version: ${{ python_min }}.*
      imports:
        - gempy
      pip_check: false  # because rattler-build installs ipykernel (see script below)
  - requirements:
      run:
        - numpy
        - pandas
        - pooch
        - pytest
    files:
      source:
        - test/
      recipe:
        - gempy_viewer.py
        - matplotlib.py
    script:
      - pytest test/test_core
      - pip check || pip check | grep "jupyter-core"
    requirements:
      run:
        - pip

about:
  license: EUPL-1.2
  license_file: LICENSE
  summary: Open-source, implicit 3D structural geological modeling in Python for uncertainty analysis
  description: |
    GemPy is an open-source, Python-based 3-D structural geological modeling software,
    which allows the implicit (i.e. automatic) creation of complex geological models
    from interface and orientation data. It also offers support for stochastic modeling
    to adress parameter and model uncertainties
  homepage: https://github.com/gempy-project/gempy
  repository: https://github.com/gempy-project/gempy
  documentation: https://docs.gempy.org/

extra:
  recipe-maintainers:
    - sebhmg
    - conda-forge/geoh5py
    - Leguark
    - AndrewAnnex
